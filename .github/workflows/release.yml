name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: test
        run: go test -count=1 ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: version
        id: ver
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::tag is not vX.Y.Z[-suffix]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: scripts/build.sh --version "$VERSION" --out dist
      - name: package and sign
        env:
          NEXARA_RELEASE_SIGNING_KEY: ${{ secrets.NEXARA_RELEASE_SIGNING_KEY }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ -z "$NEXARA_RELEASE_SIGNING_KEY" ]; then
            echo "::error::secret NEXARA_RELEASE_SIGNING_KEY is not set"
            exit 1
          fi
          scripts/release.sh "$VERSION" dist
      - name: verify signature
        run: |
          openssl pkeyutl -verify -pubin -inkey deploy/keys/nexara-release.pub \
            -rawin -in dist/SHA256SUMS -sigfile dist/SHA256SUMS.sig
          (cd dist && sha256sum -c SHA256SUMS)
      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then
            flags="--prerelease"
          fi
          # shellcheck disable=SC2086
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Nexara Nexus ${TAG}" \
            --generate-notes \
            $flags
