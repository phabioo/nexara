name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        # Failures are also emitted as annotations (readable without signing in).
        run: |
          set -o pipefail
          if ! go test -race -count=1 ./... 2>&1 | tee test.log; then
            grep -E -- '--- FAIL|^FAIL|panic:|_test\.go:[0-9]+|\.go:[0-9]+:' test.log | head -120 > fail.log || true
            split -l 12 fail.log chunk.
            for f in chunk.*; do
              msg="$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')"
              echo "::error title=go test::${msg}"
            done
            exit 1
          fi
      - name: build (CGO_ENABLED=0)
        env:
          CGO_ENABLED: "0"
        run: go build ./...
