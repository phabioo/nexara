# Nexara Grid Agent configuration (example).
# Installed as /usr/share/nexara/agent.example.yaml. Hosts enrolled through the
# hub get /etc/grid-agent/agent.yaml written during enrollment. On the hub device
# the .deb writes it on the first install only (root, 0600): hub.url is the
# placeholder wss://127.0.0.1:8443/grid/connect, shell.user is the installing sudo
# user, and the enroll block below is active.

hub:
  url: wss://frpi5.local:8443/grid/connect

tls:
  ca: /var/lib/grid-agent/ca.pem
  cert: /var/lib/grid-agent/agent.pem
  key: /var/lib/grid-agent/agent.key

metrics:
  interval_seconds: 2

shell:
  user: pi   # the Pi's normal sudo user, never root

capabilities:
  monitoring: true
  packages: true
  services: true
  shell: true
  power: true
  docker: false

# Hub device only: until the agent has a certificate it waits for this one-time
# token, which the hub writes when the setup wizard finishes (self-link).
# enroll:
#   token_file: /var/lib/nexus/self-enroll.token
