# Nexara Nexus hub configuration (example).
# Installed as /usr/share/nexara/nexus.example.yaml. The .deb writes
# /etc/nexus/nexus.yaml (nexus:nexus, 0640) on the first install only, with the
# same values except: hub.name = short host name, hub.timezone = system timezone,
# and no hub.agent_address (the hub detects <hostname>.local until the setup
# wizard asks for it). Upgrades never overwrite it. The setup wizard rewrites the
# file (without comments), so edit with care.

hub:
  name: frpi5
  timezone: Europe/Berlin
  # Address agents use to reach the hub (host[:port]); optional, the setup wizard sets it
  agent_address: frpi5.local
  listen: ":8443"

tls:
  # "self" = hub issues its own certificate from its CA
  mode: self
  dir: /var/lib/nexus/pki

storage:
  database: /var/lib/nexus/nexus.db
  history:
    minute_days: 7
    hour_days: 365

security:
  session_idle_hours: 12   # ignored: fixed at 12 h (decision #52)
  totp_required: false     # ignored: two-factor login is mandatory (decision #51)
  login_rate_limit:
    attempts: 5
    window_minutes: 15

alerts:
  cpu_temp_c: 75
  disk_used_percent: 90
  host_offline_seconds: 60
